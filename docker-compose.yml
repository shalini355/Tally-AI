services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    ports:
      - "5432:5432"
    volumes:
      - tally-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  tally-postgres:
